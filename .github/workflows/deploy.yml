name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The userscript is published from the same artifact as the demo, so it always matches the
      # commit that was built. Canonical URL (linked from README.md, used by `@require`,
      # `@updateURL` and `@downloadURL`):
      #   https://someonehx.github.io/WebLiquidGlass/liquid-glass-refract.user.js
      # The run number is stamped into @version so a userscript manager sees a new version on
      # every deploy and actually re-fetches the file.
      - name: Stage the userscript into the Pages artifact
        run: |
          set -euo pipefail
          node --check userscript/liquid-glass-refract.user.js
          node scripts/stamp-userscript.mjs "${GITHUB_RUN_NUMBER}" dist/liquid-glass-refract.user.js
          node --check dist/liquid-glass-refract.user.js
          test -s dist/liquid-glass-refract.user.js
          grep -m1 '^// @version' dist/liquid-glass-refract.user.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
